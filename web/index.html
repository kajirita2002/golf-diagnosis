<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Swing Lab</title>
<link rel="icon" href="data:,">
<!--
  殻（docs/DESIGN_v2.md §4・§14）。画面は全部 JS がハッシュのルートで描く（#/home・#/record・#/session/{id} …）。
  素の HTML/CSS/JS（ビルド不要・外部 CDN なし）。色・文字・部品は tokens.css、アイコンは icons.svg。
  - app.js     … ルーター・API・シート・トースト・エラー・書式・起動
  - home.js    … ホーム（homeState）
  - record.js  … 記録（取り込み: スクショ・貼り付け・CSV・レポートのリンク）
  - diagnosis.js … 診断レポート（課題 → 原因の動き → 理想の動き → 直し方 → 確かめ方）・ホームと練習の部品
  - report.js  … 診断（要点）・くわしい解説・数字・一球ずつ・一回だけの実験・プランを始めるシート
  - practice.js… 練習（組み方・練習中・練習の結果）
  - progress.js… 経過（プランの進み・あなたの記録・記録の一覧・2日の比較）
  - settings.js… 設定
  - video.js   … 動画から P1〜P7 を選ぶ・タップ・体の点（MediaPipe と mp4box は vendor/ から使うときだけ読む）
  - checkpoints.js … チェック一覧・項目1つ・撮り方ガイド
  - ideal.js   … 理想と比べる（範囲の面と目安の線・自分のベスト・端末の動画）
  - figures.js … 図（開いたときだけ読む）
-->
<script>
  // テーマは描く前に決める（ちらつかせない）。読めなければ自動
  try { const t = localStorage.getItem("golf.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch { /* 自動 */ }
</script>
<link rel="stylesheet" href="tokens.css">
<script src="app.js" defer></script>
<script src="home.js" defer></script>
<script src="record.js" defer></script>
<script src="diagnosis.js" defer></script>
<script src="report.js" defer></script>
<script src="practice.js" defer></script>
<script src="progress.js" defer></script>
<script src="settings.js" defer></script>
<script src="video.js" defer></script>
<script src="checkpoints.js" defer></script>
<script src="ideal.js" defer></script>
</head>
<body>
<div id="banners" aria-live="polite"></div>
<main id="view" tabindex="-1"></main>
<nav class="tabbar" id="tabbar" aria-label="画面">
  <a href="#/home" data-tab="home"><svg class="icon" aria-hidden="true"><use href="icons.svg#home"/></svg><span>ホーム</span></a>
  <a href="#/record" data-tab="record"><svg class="icon" aria-hidden="true"><use href="icons.svg#history"/></svg><span>記録</span></a>
  <a href="#/practice" data-tab="practice"><svg class="icon" aria-hidden="true"><use href="icons.svg#practice"/></svg><span>練習</span></a>
  <a href="#/progress" data-tab="progress"><svg class="icon" aria-hidden="true"><use href="icons.svg#progress"/></svg><span>経過</span></a>
</nav>
<div id="live" class="visually-hidden" aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
