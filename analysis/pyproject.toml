[project]
name = "golf-analysis"
version = "0.1.0"
description = "Golf Swing Diagnosis Engine の分析サービス（深い診断）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.0",
    "anthropic>=1.9.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["golf_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
