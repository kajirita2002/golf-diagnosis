<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 256" role="img">
<title>お尻の後ろに椅子</title>
<desc>上から見た図。目標は矢印の向き、打つ人は図の下側に立つ。打つ人のお尻の後ろに椅子を置く。インパクトで目標側のお尻が椅子に触れているかを確かめる。</desc>
<g class="d-shapes"><line class="g-axis" x1="20" y1="96" x2="330" y2="96" stroke-dasharray="6 4" stroke-width="1.5"/><polygon class="g-sub" points="340,96 328,90 328,102"/><circle class="g-good" cx="180" cy="96" r="7"/><rect class="g-band" x="141" y="140" width="18" height="34" rx="8"/><rect class="g-band" x="201" y="140" width="18" height="34" rx="8"/><ellipse class="g-band" cx="180" cy="190" rx="44" ry="16"/><rect class="g-miss" x="140" y="212" width="80" height="14" rx="3"/></g>
<g class="d-labels"><text class="g-text t12" x="318" y="84" text-anchor="middle" font-size="12">目標</text><text class="g-text t12" x="180" y="246" text-anchor="middle" font-size="12">椅子（お尻の後ろ）</text></g>
</svg>
