<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img">
<title>フォローでトゥを上に</title>
<desc>後ろから見たフォロー（クラブが地面と平行）の図。トゥが真上を向いて止まる。</desc>
<g class="d-shapes"><line class="g-axis" x1="60" y1="120" x2="230" y2="120" stroke-width="3"/><line class="g-axis" x1="20" y1="170" x2="340" y2="170"/><rect class="g-band" x="230" y="84" width="22" height="48" rx="6"/><polygon class="g-good" points="241,52 232,68 250,68"/></g>
<g class="d-labels"><text class="g-text t12" x="318" y="84" text-anchor="middle" font-size="12">目標</text><text class="g-text t12" x="241" y="46" text-anchor="middle" font-size="12">トゥが上</text><text class="g-text t12" x="180" y="190" text-anchor="middle" font-size="12">地面</text></g>
</svg>
