<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img">
<title>後ろ足を半歩引く</title>
<desc>上から見た図。目標は矢印の向き、打つ人は図の下側に立つ。いつも通りに立ってから、目標と反対側の足を半歩後ろへ引く。ボールの位置は変えない。</desc>
<g class="d-shapes"><line class="g-axis" x1="20" y1="96" x2="330" y2="96" stroke-dasharray="6 4" stroke-width="1.5"/><polygon class="g-sub" points="340,96 328,90 328,102"/><circle class="g-good" cx="180" cy="96" r="7"/><rect class="g-band" x="201" y="168" width="18" height="34" rx="8"/><rect class="g-band" x="141" y="190" width="18" height="34" rx="8"/><rect class="g-axis" x="141" y="168" width="18" height="34" rx="8" stroke-dasharray="3 3"/></g>
<g class="d-labels"><text class="g-text t12" x="318" y="84" text-anchor="middle" font-size="12">目標</text><text class="g-text t12" x="110" y="238" text-anchor="middle" font-size="12">後ろ足を半歩引く</text></g>
</svg>
