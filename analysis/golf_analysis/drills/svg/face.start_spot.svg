<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
<title>打ち出しの印</title>
<desc>上から見た図。目標は矢印の向き、打つ人は図の下側に立つ。ボールの30〜50cm 先の目標線の上に平らな印を置き、その真上に打ち出す。立てた物は置かない。</desc>
<g class="d-shapes"><line class="g-axis" x1="20" y1="96" x2="330" y2="96" stroke-dasharray="6 4" stroke-width="1.5"/><polygon class="g-sub" points="340,96 328,90 328,102"/><rect class="g-band" x="141" y="168" width="18" height="34" rx="8"/><rect class="g-band" x="201" y="168" width="18" height="34" rx="8"/><circle class="g-good" cx="180" cy="96" r="7"/><rect class="g-miss" x="228" y="92" width="22" height="8" rx="2"/></g>
<g class="d-labels"><text class="g-text t12" x="318" y="84" text-anchor="middle" font-size="12">目標</text><text class="g-text t12" x="239" y="82" text-anchor="middle" font-size="12">平らな印</text><text class="g-text t12" x="239" y="122" text-anchor="middle" font-size="12">30〜50cm 先</text></g>
</svg>
