<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
<title>2球並べ（先端寄りを減らす）</title>
<desc>上から見た図。目標は矢印の向き、打つ人は図の下側に立つ。打つボールの手前（ヒールの手前2〜3cm）にもう1つボールを置き、向こう側のボールだけを打つ。</desc>
<g class="d-shapes"><line class="g-axis" x1="20" y1="96" x2="330" y2="96" stroke-dasharray="6 4" stroke-width="1.5"/><polygon class="g-sub" points="340,96 328,90 328,102"/><rect class="g-band" x="141" y="168" width="18" height="34" rx="8"/><rect class="g-band" x="201" y="168" width="18" height="34" rx="8"/><circle class="g-good" cx="180" cy="96" r="7"/><circle class="g-miss" cx="180" cy="113" r="7"/></g>
<g class="d-labels"><text class="g-text t12" x="318" y="84" text-anchor="middle" font-size="12">目標</text><text class="g-text t12" x="180" y="140" text-anchor="middle" font-size="12">触らない（ヒールの手前 2〜3cm）</text><text class="g-text t12" x="214" y="84" text-anchor="middle" font-size="12">打つ</text></g>
</svg>
